name: StudyWorkbench automated checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13.17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m ruff check backend tools
      - run: python -m pytest --junitxml=artifacts/backend.xml
      - name: R1–R5 public HTTP black-box regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          foreach ($stage in 1..5) {
            python "tools/check_r${stage}_blackbox.py" ".local/ci-r${stage}-blackbox"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.python }}
          path: artifacts/backend.xml
  desktop:
    # WebView Windows 0.6.0 uses legacy coroutine headers; VS18 is not compatible.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
      - run: python -m venv .venv
        working-directory: .
      - run: .venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - shell: pwsh
        run: |
          $taskRoot = (Resolve-Path ../..).Path
          flutter test --dart-define="STUDY_ROOT=$taskRoot" --dart-define="STUDY_DATA_DIR=$taskRoot/.local/ci-pipe-tests"
      - run: flutter build windows --release
      - name: Native resource drop COM boundary check
        shell: pwsh
        run: |
          $cmake = ((Select-String -Path build/windows/x64/CMakeCache.txt -Pattern '^CMAKE_COMMAND:INTERNAL=').Line -split '=', 2)[1]
          & $cmake --build build/windows/x64 --config Release --target resource_drop_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/x64/runner/Release/resource_drop_check.exe
          exit $LASTEXITCODE
      - run: ./packaging/windows/build-backend.ps1 -Python .venv/Scripts/python.exe
        working-directory: .
      - name: Frozen unified resource import and document regression
        run: .venv/Scripts/python.exe tools/check_resource_explorer.py --exe dist/study_backend/study_backend.exe --test-root .local/ci-unified-import --documents
        working-directory: .
      - name: Frozen offline library integrity check
        run: .venv/Scripts/python.exe tools/check_library_integrity.py --exe dist/study_backend/study_backend.exe --test-root .local/ci-library-integrity
        working-directory: .
      - name: Frozen API error compatibility check
        run: .venv/Scripts/python.exe tools/check_api_errors.py --exe dist/study_backend/study_backend.exe --test-root .local/ci-api-errors
        working-directory: .
      - shell: pwsh
        run: |
          $real = Join-Path $pwd '.local/lifecycle-temp-real'
          $alias = Join-Path $pwd '.local/lifecycle-temp-alias'
          New-Item -ItemType Directory -Path $real | Out-Null
          New-Item -ItemType Junction -Path $alias -Target $real | Out-Null
          $env:TEMP = $alias
          $env:TMP = $alias
          .venv/Scripts/python.exe tools/check_backend_lifecycle.py --exe dist/study_backend/study_backend.exe
        working-directory: .
      - run: .venv/Scripts/python.exe tools/check_document_workers.py --exe dist/study_backend/study_backend.exe
        working-directory: .
      - name: Explicit Bilibili public metadata preview
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/bilibili-preview'
        working-directory: .
        timeout-minutes: 4
        shell: pwsh
        run: |
          .venv/Scripts/python.exe tools/check_bilibili_previews.py --allow-public-fixture --test-root .local/ci-bilibili-source
          $sourceResult = $LASTEXITCODE
          .venv/Scripts/python.exe tools/check_bilibili_previews.py --allow-public-fixture --exe dist/study_backend/study_backend.exe --test-root .local/ci-bilibili-frozen
          $frozenResult = $LASTEXITCODE
          if ($sourceResult -ne 0 -or $frozenResult -ne 0) { exit 1 }
          exit 0
      - name: Retain Bilibili metadata diagnostic results
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/bilibili-preview'
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-metadata-preview-${{ github.event.pull_request.head.sha }}
          path: |
            .local/ci-bilibili-source/summary.json
            .local/ci-bilibili-source/failed-preview.json
            .local/ci-bilibili-frozen/summary.json
            .local/ci-bilibili-frozen/failed-preview.json
          if-no-files-found: warn
      - name: Retain Windows Release inputs for local manual-test packaging
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/build/windows/x64/runner/Release/
            !apps/desktop/build/windows/x64/runner/Release/resource_drop_check.exe
            apps/desktop/build/windows/x64/packages/
            dist/study_backend/

