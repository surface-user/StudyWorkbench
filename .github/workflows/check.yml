name: StudyWorkbench automated checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13.17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m ruff check backend tools
      - run: python -m pytest --junitxml=artifacts/backend.xml
      - name: R1–R5 public HTTP black-box regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          foreach ($stage in 1..5) {
            python "tools/check_r${stage}_blackbox.py" ".local/ci-r${stage}-blackbox"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.python }}
          path: artifacts/backend.xml
  desktop:
    # WebView Windows 0.6.0 uses legacy coroutine headers; VS18 is not compatible.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
      - run: python -m venv .venv
        working-directory: .
      - run: .venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - shell: pwsh
        run: |
          $taskRoot = (Resolve-Path ../..).Path
          flutter test --dart-define="STUDY_ROOT=$taskRoot" --dart-define="STUDY_DATA_DIR=$taskRoot/.local/ci-pipe-tests"
      - run: flutter build windows --release
      - run: ./packaging/windows/build-backend.ps1 -Python .venv/Scripts/python.exe
        working-directory: .
      - run: .venv/Scripts/python.exe tools/check_backend_lifecycle.py --exe dist/study_backend/study_backend.exe
        working-directory: .
      - run: .venv/Scripts/python.exe tools/check_document_workers.py --exe dist/study_backend/study_backend.exe
        working-directory: .

